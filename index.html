<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Random Joke Generator</title>
  <style>
    :root {
      --bg: #f5f5f4;
      --panel: #ffffff;
      --text: #18181b;
      --muted: #52525b;
      --accent: #18181b;
      --accent-hover: #3f3f46;
      --surface: #f4f4f5;
      --border: #e4e4e7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 40rem);
      padding: clamp(1.5rem, 4vw, 3rem);
      border-radius: 1.25rem;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 1.25rem 2.5rem rgba(24, 24, 27, 0.08);
    }
    .eyebrow {
      margin: 0 0 0.5rem 0;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.75rem;
      font-weight: 700;
      color: #71717a;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: -0.06em;
    }
    .intro {
      margin: 0.75rem 0 1.75rem;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1rem;
    }
    .joke {
      min-height: 8.5rem;
      padding: 1.25rem;
      border-radius: 0.9rem;
      background: var(--surface);
      white-space: pre-line;
      font-size: 1.15rem;
      line-height: 1.7;
      margin-bottom: 1.25rem;
    }
    button {
      width: 100%;
      min-height: 3.25rem;
      border: 0;
      border-radius: 0.75rem;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:focus-visible {
      outline: 3px solid #a1a1aa;
      outline-offset: 3px;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }
    .status {
      min-height: 1.5rem;
      margin-top: 0.75rem;
      color: #71717a;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Quick laugh</p>
    <h1>Random Joke Generator</h1>
    <p class="intro">This app pulls a safe joke from an external API so you can get a fresh laugh in one click.</p>

    <div id="joke" class="joke" aria-live="polite" aria-atomic="true">Tap the button for a joke.</div>
    <button id="new-joke" type="button">Tell me a joke</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    const jokeElement = document.getElementById('joke');
    const button = document.getElementById('new-joke');
    const statusElement = document.getElementById('status');

    async function getJoke() {
      button.disabled = true;
      button.textContent = 'Loading joke...';
      statusElement.textContent = '';
      jokeElement.textContent = 'Loading...';

      try {
        const response = await fetch('https://v2.jokeapi.dev/joke/Any?safe-mode');
        if (!response.ok) throw new Error(`Request failed with status ${response.status}`);

        const data = await response.json();
        if (data.error) throw new Error('Could not fetch joke');

        if (data.type === 'twopart') {
          jokeElement.textContent = `${data.setup}\n\n${data.delivery}`;
        } else {
          jokeElement.textContent = data.joke;
        }
      } catch (error) {
        jokeElement.textContent = 'Sorry, I could not fetch a joke right now.';
        statusElement.textContent = 'Please check your internet connection and try again.';
        console.error(error);
      } finally {
        button.disabled = false;
        button.textContent = 'Tell me another';
      }
    }

    button.addEventListener('click', getJoke);
  </script>
</body>
</html>
