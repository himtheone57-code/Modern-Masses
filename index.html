<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Random Joke Generator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f5;
      color: #18181b;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
    }
    main {
      width: min(100%, 38rem);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid #e4e4e7;
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 1.5rem 4rem #18181b12;
    }
    .eyebrow {
      margin: 0 0 .5rem;
      color: #71717a;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.25rem); letter-spacing: -.05em; }
    .intro { margin: .75rem 0 2rem; color: #52525b; line-height: 1.6; }
    .joke {
      min-height: 8rem;
      margin: 0 0 1.5rem;
      padding: 1.25rem;
      border-radius: .9rem;
      background: #f4f4f5;
      font-size: 1.15rem;
      line-height: 1.65;
      white-space: pre-line;
    }
    button {
      width: 100%;
      min-height: 3.25rem;
      border: 0;
      border-radius: .75rem;
      background: #18181b;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #3f3f46; }
    button:focus-visible { outline: 3px solid #a1a1aa; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .65; }
    .status { min-height: 1.5rem; margin: .75rem 0 0; color: #71717a; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little laugh break</p>
    <h1>Random Joke Generator</h1>
    <p class="intro">Need a quick laugh? Get a fresh, safe-for-work joke from JokeAPI.</p>
    <section id="joke" class="joke" aria-live="polite" aria-atomic="true">Tap the button for a joke.</section>
    <button id="new-joke" type="button">Tell me a joke</button>
    <p id="status" class="status" role="status"></p>
  </main>
  <script>
    const jokeElement = document.querySelector('#joke');
    const button = document.querySelector('#new-joke');
    const status = document.querySelector('#status');

    async function getJoke() {
      button.disabled = true;
      button.textContent = 'Finding a joke…';
      status.textContent = '';
      jokeElement.textContent = 'Loading…';

      try {
        const response = await fetch('https://v2.jokeapi.dev/joke/Any?safe-mode');
        if (!response.ok) throw new Error(`Joke service returned ${response.status}`);
        const data = await response.json();
        if (data.error) throw new Error('The joke service could not find a joke.');

        jokeElement.textContent = data.type === 'twopart'
          ? `${data.setup}\n\n${data.delivery}`
          : data.joke;
      } catch (error) {
        jokeElement.textContent = 'Sorry, I couldn’t fetch a joke right now.';
        status.textContent = 'Check your internet connection and try again.';
        console.error('Unable to load joke:', error);
      } finally {
        button.disabled = false;
        button.textContent = 'Tell me another';
      }
    }

    button.addEventListener('click', getJoke);
  </script>
</body>
</html>
